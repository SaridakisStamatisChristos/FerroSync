name: CI

on:
  push:
    branches: [main, "r7/**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Compile/static gate
        run: python -m compileall -q src tests scripts
      - name: Unit, integration, adversarial, property, crash/recovery
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: Evidence manifest
        run: python scripts/verify_manifest.py
      - name: Build wheel
        run: python -m pip wheel . --no-deps -w dist
      - name: Installed CLI smoke
        shell: bash
        run: |
          python -m pip install --force-reinstall dist/*.whl
          ferrosync --version
          tmp="$(mktemp -d)"
          mkdir "$tmp/left" "$tmp/right"
          printf smoke > "$tmp/left/smoke.txt"
          ferrosync sync "$tmp/left" "$tmp/right" --json
          ferrosync verify "$tmp/left" "$tmp/right" --json
