[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ferrosync"
version = "0.1.0"
description = "A deterministic, crash-safe bidirectional filesystem synchronization engine"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Stamatis-Christos Saridakis"}]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
]

[project.scripts]
ferrosync = "ferrosync.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
